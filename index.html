<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Trading</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#0d1117;
    color:#fff;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.top{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:#161b22;
    border-radius:12px;
    padding:15px;
    box-shadow:0 0 10px rgba(0,0,0,.3);
}

.card h3{
    margin-bottom:10px;
}

.price{
    font-size:28px;
    font-weight:bold;
}

.positive{
    color:#00c853;
}

.negative{
    color:#ff5252;
}

.section-title{
    margin:25px 0 15px;
}

.watchlist{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.stock-card{
    background:#161b22;
    border-radius:12px;
    padding:15px;
}

.stock-card .ticker{
    font-size:20px;
    font-weight:bold;
}

.stock-card .value{
    font-size:24px;
    margin-top:8px;
}

.stock-card .change{
    margin-top:5px;
}

iframe{
    border:none;
    width:100%;
}

.chart-container{
    margin-top:20px;
    background:#161b22;
    padding:10px;
    border-radius:12px;
}
</style>
</head>

<body>

<h1>📈 Dashboard Trading</h1>

<div class="top">

    <div class="card">
        <h3>Capital</h3>
        <div class="price" id="capital">0 €</div>
    </div>

    <div class="card">
        <h3>Plus / Moins Value</h3>
        <div class="price" id="pnl">0 €</div>
    </div>

    <div class="card">
        <h3>Portefeuille</h3>
        <div id="positions">0 positions</div>
    </div>

</div>

<h2 class="section-title">⭐ Watchlist</h2>

<div class="watchlist" id="watchlist"></div>

<h2 class="section-title">📊 Graphique TradingView</h2>

<div class="chart-container">

<div class="tradingview-widget-container">
  <div id="tradingview_chart"></div>
</div>

</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
const actions = [
    {symbol:"AAPL"},
    {symbol:"MSFT"},
    {symbol:"NVDA"},
    {symbol:"TSLA"},
    {symbol:"AMZN"},
    {symbol:"META"},
    {symbol:"GOOGL"},
    {symbol:"BTC-USD"}
];

const portefeuille = {
    capital:10000,
    pnl:0,
    positions:8
};

document.getElementById("capital").textContent =
    portefeuille.capital.toLocaleString('fr-FR') + " €";

document.getElementById("pnl").textContent =
    portefeuille.pnl.toLocaleString('fr-FR') + " €";

document.getElementById("positions").textContent =
    portefeuille.positions + " positions";

async function chargerCours(symbol){

    try{

        const url =
        `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}`;

        const response = await fetch(url);

        const data = await response.json();

        const result = data.chart.result[0];

        const prix =
        result.meta.regularMarketPrice;

        const precedent =
        result.meta.chartPreviousClose;

        const variation =
        ((prix - precedent) / precedent) * 100;

        return {
            prix:prix.toFixed(2),
            variation:variation.toFixed(2)
        };

    }catch(e){

        return {
            prix:"--",
            variation:"0.00"
        };

    }
}

async function afficherWatchlist(){

    const container =
    document.getElementById("watchlist");

    for(const action of actions){

        const cours =
        await chargerCours(action.symbol);

        const couleur =
        cours.variation >= 0
        ? "positive"
        : "negative";

        const card =
        document.createElement("div");

        card.className="stock-card";

        card.innerHTML=`
            <div class="ticker">${action.symbol}</div>
            <div class="value">${cours.prix}</div>
            <div class="change ${couleur}">
                ${cours.variation}%
            </div>
        `;

        container.appendChild(card);
    }
}

afficherWatchlist();

new TradingView.widget({
    "autosize": true,
    "symbol": "NASDAQ:AAPL",
    "interval": "D",
    "timezone": "Europe/Paris",
    "theme": "dark",
    "style": "1",
    "locale": "fr",
    "toolbar_bg": "#0d1117",
    "enable_publishing": false,
    "allow_symbol_change": true,
    "container_id": "tradingview_chart"
});
</script>

</body>
</html>
